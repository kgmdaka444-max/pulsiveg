<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PulsiveG — Luxury Chauffeur & VIP Transport | Johannesburg · Cape Town</title>
    <meta name="description" content="South Africa's premium chauffeur service. Mercedes V-Class, BMW executive sedans, Hyundai Staria. Pick your chauffeur, lock your rate, confirm on WhatsApp in seconds. From R6,000." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="PulsiveG — Luxury Chauffeur & VIP Transport" />
    <meta property="og:description" content="Pick your chauffeur. Lock your rate. Confirm on WhatsApp in seconds. From R6,000." />
    <meta property="og:image" content="%BASE_URL%icons/icon-512.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore the deep link captured by 404.html (GitHub Pages SPA redirect).
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("%BASE_URL%sw.js"));
      }
    </script>
  </body>
</html>
